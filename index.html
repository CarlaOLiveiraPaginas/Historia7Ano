<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aventura na História</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@19/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@19/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@12/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide-react@0.546.0/dist/umd/lucide-react.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;
      const { motion, AnimatePresence } = FramerMotion;
      const { 
        Trophy, BookOpen, Gamepad2, Calendar, Landmark, 
        FileText, GraduationCap, Award, MapPin, LogOut, 
        Sparkles, Star, Bell, Menu, X, Lightbulb, ChevronRight, 
        Compass, Sun, Moon, CheckCircle, HelpCircle, BookOpenText 
      } = LucideReact;

      const THEMES = [];                
      const GAMES_DATA = [];

      function WelcomeModal({ onNameSubmit }) {
        const [name, setName] = useState('');
        return (
          <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
            <div className="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full">
              <h2 className="text-xl font-bold mb-4">Bem-vindo à Aventura!</h2>
              <input 
                className="w-full p-3 border rounded-lg mb-4" 
                placeholder="Qual o teu nome?" 
                value={name} 
                onChange={(e) => setName(e.target.value)}
              />
              <button 
                className="w-full bg-indigo-600 text-white p-3 rounded-lg font-bold"
                onClick={() => onNameSubmit(name)}
              >
                Começar
              </button>
            </div>
          </div>
        );
      }

      function App() {
        const [isWelcomeOpen, setIsWelcomeOpen] = useState(true);
        const [name, setName] = useState('');
        
        const handleNameSubmit = (n) => {
            setName(n);
            setIsWelcomeOpen(false);
        };

        if (isWelcomeOpen) return <WelcomeModal onNameSubmit={handleNameSubmit} />;
        return <div className="p-8 text-2xl font-bold">Olá, {name}! Bem-vindo ao curso.</div>;
      }

      // Mounted to root
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);

    </script>
</body>
</html>
